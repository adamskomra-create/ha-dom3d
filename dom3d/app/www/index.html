<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dom 3D</title>
<style>
:root{--bg:#0f1318;--panel:#171c23;--line:#262d37;--txt:#e5e7eb;--mut:#9ca3af;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:grid;grid-template-columns:78px 1fr 300px;grid-template-rows:auto auto 1fr auto;height:100vh}
header{grid-column:1/4;display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:15px;margin-right:6px}
#toolopts{grid-column:2/3;padding:6px 10px;background:#141920;border-bottom:1px solid var(--line);min-height:34px;display:flex;gap:8px;align-items:center}
#tools{grid-row:2/4;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px}
#tools button{display:flex;flex-direction:column;align-items:center;width:100%;margin-bottom:4px;padding:6px 2px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--txt);cursor:pointer}
#tools button span{font-size:18px;line-height:22px}
#tools button small{font-size:10px;color:var(--mut);text-align:center}
#tools button.on{background:#1e3a5f;border-color:var(--acc)}
#tools button:hover{background:#1f2630}
#view{grid-column:2/3;grid-row:3/4;position:relative;min-height:0}
#props{grid-column:3/4;grid-row:2/4;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px}
#props h3{margin:6px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
#props label{display:grid;grid-template-columns:1fr 1.3fr;gap:6px;align-items:center;margin-bottom:5px}
#props label span{color:var(--mut);font-size:12px}
#props label:has(.mini){grid-template-columns:1fr 1.3fr auto}
#props input,#props select,#props textarea,header select,header input,#toolopts input,#toolopts select{background:#0f1318;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;min-width:0;width:100%}
#toolopts input{width:70px}#toolopts select{width:auto}
#props input[type=checkbox]{width:auto;justify-self:start}
#props input[type=color]{padding:0;height:26px}
.sub{color:var(--mut);margin:6px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
button{background:#232a35;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:#3a4554}
button.danger{border-color:#7f1d1d;color:#fecaca}
button.mini{padding:2px 7px}
#save.dirty{background:var(--acc);border-color:var(--acc);color:#fff}
.li{display:block;width:100%;text-align:left;margin:2px 0;background:transparent}
.li small{color:var(--mut)}
details{margin:6px 0}summary{cursor:pointer;color:var(--mut)}
.code{background:#0b0e12;border:1px solid var(--line);padding:8px;border-radius:6px;white-space:pre-wrap;font-size:12px}
code{background:#0b0e12;padding:1px 4px;border-radius:4px}
footer{grid-column:1/4;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ha{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}#ha.ok{background:var(--ok)}#ha.bad{background:var(--bad)}
.grow{flex:1}
#time{width:140px}
@media (max-width:900px){#app{grid-template-columns:60px 1fr;grid-template-rows:auto auto 1fr 40vh auto}#props{grid-column:1/3;grid-row:4/5}#tools button small{display:none}footer{grid-row:5}}
</style>
</head>
<body>
<div id="app">
  <header>
    <b>Dom 3D</b><span id="ha" title="Połączenie z Home Assistant"></span>
    <select id="floor" style="width:auto"></select><button id="addfloor" title="Dodaj piętro">+ piętro</button>
    <button id="mode">Widok 3D</button><button id="fit">Dopasuj</button>
    <span>☀</span><input id="time" type="range" min="-1" max="1439" step="15" value="-1"><span id="tval">na żywo</span>
    <label style="display:flex;gap:4px;align-items:center" title="Stałe światło dzienne do edycji"><input id="lighttoggle" type="checkbox" checked style="width:auto"> jasno</label>
    <label style="display:flex;gap:4px;align-items:center"><input id="bgtoggle" type="checkbox" style="width:auto"> podkład</label>
    <span class="grow"></span>
    <button id="undo" title="Ctrl+Z">↶</button><button id="redo" title="Ctrl+Shift+Z">↷</button>
    <button id="imp">Import</button><button id="exp">Eksport</button>
    <button id="save">Zapisane</button>
  </header>
  <div id="toolopts"></div>
  <nav id="tools"></nav>
  <main id="view"></main>
  <aside id="props"></aside>
  <footer id="status">Ładowanie…</footer>
</div>
<script src="panel.js"></script>
</body>
</html>
